# Minimal CI: frontend lint + tests + build, backend pytest.
# Runs on pushes to main and on all pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build must succeed without real secrets; the client falls back
          # to the local dev URL when the variable is unset.
          VITE_API_BASE_URL: http://localhost:5001/api/v1

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q
        env:
          DISABLE_SCHEDULER: "1"
