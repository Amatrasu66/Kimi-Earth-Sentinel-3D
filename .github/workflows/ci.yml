# CI: single Next.js app (lint, typecheck, test, build, bundle budget).
# Runs on pushes to main and on all pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Next.js: lint, typecheck, test, build, bundle budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # T4.5: initial-route JS ≤200 KiB gzip (lazy globe chunks excluded).
      # Runs against this job's own build output; fails the job on breach
      # or on any asset-accounting failure. No browser tooling involved.
      - run: npm run bundle:check
