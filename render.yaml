# Render deployment (backend). Frontend deploys separately on Vercel
# with Root Directory = `frontend` (see README → Deployment).
services:
  - type: web
    name: kimi-earth-sentinel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        # Set to your Vercel frontend origin(s), comma-separated.
        value: https://kimi-earth-sentinel-3d.vercel.app
      - key: REQUEST_TIMEOUT
        value: '15'
      - key: SCHEDULER_ENABLED
        # Deliberately off in production (see README → Caching): with
        # multiple Gunicorn workers each process would run its own
        # scheduler against its own process-local cache — duplicate
        # provider traffic with no shared benefit. Request-time caching
        # + stale fallback remain fully functional without warming.
        value: 'false'
      - key: AIRNOW_API_KEY
        sync: false
      - key: NASA_FIRMS_API_KEY
        sync: false
